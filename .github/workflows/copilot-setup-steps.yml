name: Copilot Setup Steps

# The environment GitHub Copilot's cloud agent starts in. Copilot runs the job named
# copilot-setup-steps before it begins work; the triggers below only validate this file in CI.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    # No TEST_* secrets: they are a real PESU account's credentials, so the live tests stay with humans and CI
    steps:
      - uses: actions/checkout@v7
        with:
          # AGENTS.md, the skills and the role files the custom agents point at live in the
          # pesu-dev/skills submodule
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up UV
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups
