name: Deploy to Production

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pesu-auth

concurrency:
  group: deploy_production
  cancel-in-progress: false

jobs:
  resolve_version:
    name: Resolve version tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version_info.outputs.version }}
      version_tag: ${{ steps.version_info.outputs.version_tag }}
      commit_sha: ${{ steps.version_info.outputs.commit_sha }}
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v7
        with:
          ref: dev

      - name: Resolve project version
        id: version_info
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION} (tag: v${VERSION})"

  await_approval:
    name: Approve ${{ needs.resolve_version.outputs.version_tag }}
    needs: [resolve_version]
    runs-on: ubuntu-latest
    environment: promote-gate
    steps:
      - name: Production promotion approved
        run: |
          echo "✅ Approved ${{ needs.resolve_version.outputs.version_tag }} (commit ${{ needs.resolve_version.outputs.commit_sha }}) for production deployment."

  sync_dev_to_main:
    name: Sync dev branch to main
    needs: [await_approval]
    runs-on: ubuntu-latest
    if: ${{ !vars.PROD_DEPLOYMENT_ALLOWED_USERS || contains(fromJson(vars.PROD_DEPLOYMENT_ALLOWED_USERS), github.actor) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: |
          git fetch origin dev
          git fetch origin main

      - name: Checkout main branch
        run: git checkout main

      - name: Merge dev into main
        run: |
          git merge --ff-only origin/dev || {
            echo "❌ Fast-forward merge failed. Manual conflict resolution required."
            echo "Please ensure dev branch is ahead of main with no conflicts."
            exit 1
          }

      - name: Push updated main branch
        run: git push origin main

  build_and_push_image:
    name: Build and push production image
    needs: [resolve_version, await_approval]
    uses: pesu-dev/actions/.github/workflows/build_push_image.yml@v1
    with:
      ref: dev
      image_name: pesu-auth
      image_tag: ${{ needs.resolve_version.outputs.version_tag }}
      platforms: linux/amd64,linux/arm64
      push: true
    secrets:
      docker_username: ${{ secrets.DOCKER_USERNAME }}
      docker_password: ${{ secrets.DOCKER_PASSWORD }}

  deploy_prod:
    name: Deploy to Render Production
    needs: [sync_dev_to_main, resolve_version, build_and_push_image]
    uses: pesu-dev/actions/.github/workflows/deploy_render.yml@v1
    with:
      environment: production
      image_url: ghcr.io/${{ github.repository_owner }}/pesu-auth:${{ needs.resolve_version.outputs.version_tag }}
      wait_for_completion: true
    secrets: inherit

  rollback_prod:
    name: Rollback prod to last stable prod image
    needs: [deploy_prod]
    if: failure() && needs.deploy_prod.result == 'failure'
    uses: pesu-dev/actions/.github/workflows/deploy_render.yml@v1
    with:
      environment: production
      image_url: ghcr.io/${{ github.repository_owner }}/pesu-auth:prod
    secrets: inherit

  fail_after_rollback:
    name: Mark deployment as failed after rollback
    needs: [deploy_prod, rollback_prod]
    if: always() && needs.deploy_prod.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Fail the workflow
        run: exit 1

  tag_prod_and_latest:
    name: Tag image as prod and latest
    needs: [resolve_version, build_and_push_image, deploy_prod]
    if: needs.deploy_prod.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    env:
      VERSION_TAG: ${{ needs.resolve_version.outputs.version_tag }}
      DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - name: GHCR login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag GHCR image as latest and prod
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${VERSION_TAG}"

          docker buildx imagetools create \
            --prefer-index=false \
            --tag "${IMAGE}:prod" \
            "${IMAGE}:${VERSION_TAG}"

      - name: Retag Docker Hub image as latest and prod
        if: env.DOCKER_USER != '' && env.DOCKER_PASS != ''
        run: |
          set -euo pipefail
          echo "${DOCKER_PASS}" | docker login -u "${DOCKER_USER}" --password-stdin
          REPO_NAME="pesu-auth"
          DOCKERHUB_IMAGE="${DOCKER_USER}/${REPO_NAME}"
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "${DOCKERHUB_IMAGE}:latest" \
            "${DOCKERHUB_IMAGE}:${VERSION_TAG}"

          docker buildx imagetools create \
            --prefer-index=false \
            --tag "${DOCKERHUB_IMAGE}:prod" \
            "${DOCKERHUB_IMAGE}:${VERSION_TAG}"

  release:
    name: Create release and tag
    needs: [sync_dev_to_main, resolve_version, deploy_prod, tag_prod_and_latest]
    if: needs.deploy_prod.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TARGET_SHA: ${{ needs.resolve_version.outputs.commit_sha }}
      TAG: ${{ needs.resolve_version.outputs.version_tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout target SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Confirm target SHA is on origin/dev
        run: |
          set -euo pipefail
          git fetch origin dev --prune
          if ! git merge-base --is-ancestor "${TARGET_SHA}" origin/dev; then
            echo "Target SHA ${TARGET_SHA} is no longer on origin/dev."
            exit 1
          fi

      - name: Create git tag and GitHub Release if needed
        run: |
          set -euo pipefail
          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/${TAG}"; then
            TAGGED_SHA="$(git rev-list -n 1 "${TAG}")"
            if [ "${TAGGED_SHA}" = "${TARGET_SHA}" ]; then
              echo "Git tag ${TAG} already points at ${TARGET_SHA}; skipping release create."
              exit 0
            fi
            echo "Git tag ${TAG} already exists on ${TAGGED_SHA}, not ${TARGET_SHA}."
            exit 1
          fi

          gh release create "${TAG}" --generate-notes --target "${TARGET_SHA}" --title "${TAG}"
