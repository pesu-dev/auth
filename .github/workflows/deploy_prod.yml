name: Deploy to Production

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pesu-auth

concurrency:
  group: deploy_production
  cancel-in-progress: false

jobs:
  resolve_version:
    name: Resolve version tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version_info.outputs.version }}
      version_tag: ${{ steps.version_info.outputs.version_tag }}
      commit_sha: ${{ steps.version_info.outputs.commit_sha }}
    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v7
        with:
          ref: dev

      - name: Resolve project version
        id: version_info
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION} (tag: v${VERSION}) at ${COMMIT_SHA}"

  await_approval:
    name: Approve ${{ needs.resolve_version.outputs.version_tag }}
    needs: [resolve_version]
    runs-on: ubuntu-latest
    environment: promote-gate
    steps:
      - name: Production promotion approved
        run: |
          echo "✅ Approved ${{ needs.resolve_version.outputs.version_tag }} (commit ${{ needs.resolve_version.outputs.commit_sha }}) for production deployment."

  deploy_prod:
    name: Deploy to Render Production
    needs: [resolve_version, await_approval]
    uses: pesu-dev/actions/.github/workflows/deploy_render.yml@v1
    with:
      environment: production
      image_url: ghcr.io/${{ github.repository_owner }}/pesu-auth:${{ needs.resolve_version.outputs.commit_sha }}
      wait_for_completion: true
    secrets: inherit

  rollback_prod:
    name: Rollback prod to last stable prod image
    needs: [deploy_prod]
    if: failure() && needs.deploy_prod.result == 'failure'
    uses: pesu-dev/actions/.github/workflows/deploy_render.yml@v1
    with:
      environment: production
      image_url: ghcr.io/${{ github.repository_owner }}/pesu-auth:prod
    secrets: inherit

  fail_after_rollback:
    name: Mark deployment as failed after rollback
    needs: [deploy_prod, rollback_prod]
    if: always() && needs.deploy_prod.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Fail the workflow
        run: exit 1

  release:
    name: Create release, sync main, and retag
    needs: [resolve_version, deploy_prod]
    if: needs.deploy_prod.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      TARGET_SHA: ${{ needs.resolve_version.outputs.commit_sha }}
      TAG: ${{ needs.resolve_version.outputs.version_tag }}
      DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - name: Generate release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Sync dev branch to main
        run: |
          set -euo pipefail
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git fetch origin dev main --prune
          git checkout main
          git merge --ff-only origin/dev || {
            echo "❌ Fast-forward merge failed. Manual conflict resolution required."
            echo "Please ensure dev branch is ahead of main with no conflicts."
            exit 1
          }
          git push origin main

      - name: GHCR login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag GHCR image as version, latest, and prod
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "${IMAGE}:${TAG}" \
            "${IMAGE}:${TARGET_SHA}"

          docker buildx imagetools create \
            --prefer-index=false \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:${TARGET_SHA}"

          docker buildx imagetools create \
            --prefer-index=false \
            --tag "${IMAGE}:prod" \
            "${IMAGE}:${TARGET_SHA}"

      - name: Retag Docker Hub image as version, latest, and prod
        if: env.DOCKER_USER != '' && env.DOCKER_PASS != ''
        run: |
          set -euo pipefail
          echo "${DOCKER_PASS}" | docker login -u "${DOCKER_USER}" --password-stdin
          DOCKERHUB_IMAGE="${DOCKER_USER}/pesu-auth"

          docker buildx imagetools create \
            --prefer-index=false \
            --tag "${DOCKERHUB_IMAGE}:${TAG}" \
            "${IMAGE}:${TARGET_SHA}"

          docker buildx imagetools create \
            --prefer-index=false \
            --tag "${DOCKERHUB_IMAGE}:latest" \
            "${IMAGE}:${TARGET_SHA}"

          docker buildx imagetools create \
            --prefer-index=false \
            --tag "${DOCKERHUB_IMAGE}:prod" \
            "${IMAGE}:${TARGET_SHA}"

      - name: Create git tag and GitHub Release if needed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/${TAG}"; then
            TAGGED_SHA="$(git rev-list -n 1 "${TAG}")"
            if [ "${TAGGED_SHA}" = "${TARGET_SHA}" ]; then
              echo "Git tag ${TAG} already points at ${TARGET_SHA}; skipping release create."
              exit 0
            fi
            echo "Git tag ${TAG} already exists on ${TAGGED_SHA}, not ${TARGET_SHA}."
            exit 1
          fi

          gh release create "${TAG}" --generate-notes --target "${TARGET_SHA}" --title "${TAG}"
