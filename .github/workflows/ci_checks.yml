name: CI Checks

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - dev
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  pr_source_checker:
    name: PR source checker
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR origin and target branch
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Non-PR event (${{ github.event_name }}): PR source checker passes by default."
            exit 0
          fi

          echo "PR source information:"
          echo "  - PR Number: $PR_NUMBER"
          echo "  - Source repo: $SOURCE_REPO"
          echo "  - Source branch: $SOURCE_BRANCH"
          echo "  - Target repo: $TARGET_REPO"
          echo "  - Target branch: $TARGET_BRANCH"

          if [ "$SOURCE_REPO" = "$TARGET_REPO" ]; then
            echo "ℹ️ Pull request originates from this repository ($SOURCE_REPO)."
          else
            echo "ℹ️ Pull request originates from fork ($SOURCE_REPO)."
          fi

          if [ "$SOURCE_BRANCH" = "main" ]; then
            echo "❌ PR cannot come from the 'main' branch."
            exit 1
          fi

          if [ "$TARGET_BRANCH" != "dev" ]; then
            echo "❌ PR must target the 'dev' branch only. PRs to 'main' are not allowed."
            exit 1
          fi

          echo "✅ PR passed origin and target branch checks."

  package_checks:
    name: Package checks
    needs: [pr_source_checker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run Ruff Lint
        run: uv run ruff check . --output-format=github

      - name: Run Ruff Format Check
        run: uv run ruff format . --check

      - name: Run source compile checks
        run: uv run -m compileall -q .

  test_runner:
    name: Test suite & coverage
    needs: [pr_source_checker]
    runs-on: ubuntu-latest
    env:
      TEST_NAME: ${{ secrets.TEST_NAME }}
      TEST_PRN: ${{ secrets.TEST_PRN }}
      TEST_SRN: ${{ secrets.TEST_SRN }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
      TEST_BRANCH: ${{ secrets.TEST_BRANCH }}
      TEST_PROGRAM: ${{ secrets.TEST_PROGRAM }}
      TEST_SEMESTER: ${{ secrets.TEST_SEMESTER }}
      TEST_SECTION: ${{ secrets.TEST_SECTION }}
      TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
      TEST_PHONE: ${{ secrets.TEST_PHONE }}
      TEST_CAMPUS: ${{ secrets.TEST_CAMPUS }}
      TEST_CAMPUS_CODE: ${{ secrets.TEST_CAMPUS_CODE }}
      TEST_FIRST_NAME: ${{ secrets.TEST_FIRST_NAME }}
      TEST_MIDDLE_NAME: ${{ secrets.TEST_MIDDLE_NAME }}
      TEST_LAST_NAME: ${{ secrets.TEST_LAST_NAME }}
      TEST_BRANCH_SHORT_CODE: ${{ secrets.TEST_BRANCH_SHORT_CODE }}
      TEST_GENDER: ${{ secrets.TEST_GENDER }}
      TEST_DATE_OF_BIRTH: ${{ secrets.TEST_DATE_OF_BIRTH }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Run tests with coverage
        run: uv run python scripts/run_tests.py

  pr_image_build:
    name: Build image on PR
    needs: [pr_source_checker]
    if: github.event_name == 'pull_request'
    uses: pesu-dev/actions/.github/workflows/build_push_image.yml@v1
    with:
      image_name: pesu-auth
      image_tag: ${{ github.event.pull_request.head.sha }}
      push: false

  version_check:
    name: Version check
    needs: [pr_source_checker]
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify project version was bumped
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA=$(jq -r '.pull_request.base.sha' "$GITHUB_EVENT_PATH")
            BASE_REF=$(jq -r '.pull_request.base.ref' "$GITHUB_EVENT_PATH")
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            BASE_SHA=$(jq -r '.merge_group.base_sha' "$GITHUB_EVENT_PATH")
            BASE_REF=$(jq -r '.merge_group.base_ref' "$GITHUB_EVENT_PATH")
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE_SHA=$(jq -r '.before // empty' "$GITHUB_EVENT_PATH")
            if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE_SHA}:pyproject.toml" 2>/dev/null; then
              BASE_SHA=$(git rev-parse HEAD~1)
            fi
            BASE_REF="${{ github.ref_name }}"
          else
            echo "Non-version-checked event: ${{ github.event_name }}"
            exit 0
          fi

          echo "Comparing against $BASE_REF ($BASE_SHA)..."
          git show "$BASE_SHA:pyproject.toml" > /tmp/base_pyproject.toml
          git show "$BASE_SHA:uv.lock" > /tmp/base_uv.lock
          python3 .github/scripts/check_version_bump.py \
            --base-pyproject /tmp/base_pyproject.toml \
            --head-pyproject pyproject.toml \
            --head-lock uv.lock \
            --base-ref "$BASE_REF"

  container_checks:
    name: Container security & smoke test
    needs: [pr_source_checker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build image locally
        run: docker build . --tag pesu-auth-test

      - name: Verify container runs as non-root (UID 10001)
        run: |
          set -euo pipefail
          RUN_UID=$(docker run --rm pesu-auth-test id -u)
          echo "Container runtime UID: ${RUN_UID}"
          if [ "${RUN_UID}" != "10001" ]; then
            echo "❌ Container runs as UID ${RUN_UID}, expected 10001 (non-root)."
            exit 1
          fi
          echo "✅ Container verified running as unprivileged UID 10001."

      - name: Verify container starts and responds to HTTP health check
        run: |
          set -euo pipefail
          docker run --name pesu-auth-smoke -d -p 5000:5000 pesu-auth-test
          sleep 5
          RESPONSE=$(curl --fail --max-time 10 http://localhost:5000/health || echo "fail")
          if [ "$RESPONSE" = "fail" ]; then
            echo "❌ Container did not respond to /health."
            docker logs pesu-auth-smoke
            docker stop pesu-auth-smoke
            exit 1
          fi
          echo "✅ Container is healthy and responsive: $RESPONSE"
          docker stop pesu-auth-smoke

  greenlight:
    name: Greenlight - CI checks
    needs:
      - pr_source_checker
      - package_checks
      - test_runner
      - pr_image_build
      - container_checks
      - version_check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Collect CI check statuses
        env:
          CHECK_RESULTS: >-
            pr_source_checker=${{ needs.pr_source_checker.result }}
            package_checks=${{ needs.package_checks.result }}
            test_runner=${{ needs.test_runner.result }}
            pr_image_build=${{ needs.pr_image_build.result }}
            container_checks=${{ needs.container_checks.result }}
            version_check=${{ needs.version_check.result }}
        run: |
          set -euo pipefail

          failed=0
          echo "CI check statuses:"
          for entry in $CHECK_RESULTS; do
            name="${entry%%=*}"
            result="${entry#*=}"
            echo "  - ${name}: ${result}"

            case "${result}" in
              success|skipped)
                ;;
              failure|cancelled)
                failed=1
                ;;
              *)
                echo "Unexpected result for ${name}: ${result}"
                failed=1
                ;;
            esac
          done

          if [ "${failed}" -ne 0 ]; then
            echo "greenlight failed: one or more CI checks did not pass."
            exit 1
          fi

          echo "greenlight passed: all CI checks are clear."
