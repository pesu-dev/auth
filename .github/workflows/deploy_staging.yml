name: Deploy to Staging

on:
  workflow_run:
    workflows:
      - CI Checks
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pesu-auth

concurrency:
  group: deploy_staging
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare staging deployment
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'dev') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'dev')
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
      eligible: ${{ steps.vars.outputs.eligible }}
    steps:
      - name: Resolve deployment commit SHA
        id: vars
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          DEV_HEAD=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/dev" --jq .object.sha)
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "sha=$DEV_HEAD" >> "$GITHUB_OUTPUT"
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: deploying current dev HEAD ($DEV_HEAD)."
            exit 0
          fi
          if [ "$DEV_HEAD" != "$EVENT_SHA" ]; then
            echo "::notice::dev advanced past $EVENT_SHA; skipping stale staging deployment."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "sha=$EVENT_SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved commit SHA from workflow_run: $EVENT_SHA"

  build_and_push_image:
    name: Build and push commit image
    needs: [prepare]
    if: needs.prepare.outputs.eligible == 'true'
    uses: pesu-dev/actions/.github/workflows/build_push_image.yml@v1
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      image_name: pesu-auth
      image_tag: ${{ needs.prepare.outputs.sha }}
      platforms: linux/amd64,linux/arm64
      push: true

  deploy_staging:
    name: Deploy to staging
    needs: [prepare, build_and_push_image]
    uses: pesu-dev/actions/.github/workflows/deploy_render.yml@v1
    with:
      environment: staging
      commit_sha: ${{ needs.prepare.outputs.sha }}
      wait_for_completion: true
    secrets: inherit

  tag_staging:
    name: Tag deployed image as staging
    needs: [prepare, deploy_staging]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: GHCR login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag commit image as staging
        env:
          SHA_TAG: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "${IMAGE}:staging" \
            "${IMAGE}:${SHA_TAG}"
