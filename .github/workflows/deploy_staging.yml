# Deploys dev to the staging Render service. It runs after CI Checks passes on a push to dev (a merged pull request), or
# when started by hand on dev. Render builds the commit itself; staging builds and publishes no image, because Docker
# Hub and GHCR images come only from production releases (deploy_prod.yml).
name: Deploy to Staging

on:
  workflow_run:
    workflows:
      - CI Checks
    types:
      - completed
    # Only CI runs on dev start this workflow, so pull request and merge queue runs do not leave skipped runs.
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

# One staging deploy at a time. A running deploy is never cancelled; GitHub keeps only the newest waiting run, which is
# the one to deploy.
concurrency:
  group: deploy_staging
  cancel-in-progress: false

jobs:
  # Picks the commit to deploy: dev's latest commit when started by hand, otherwise the commit CI passed on, unless dev
  # has moved past it (the newer commit's own CI run deploys that one).
  prepare:
    name: Prepare staging deployment
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'dev') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'dev')
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
      eligible: ${{ steps.vars.outputs.eligible }}
    steps:
      - name: Resolve deployment commit SHA
        id: vars
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          DEV_HEAD=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/dev" --jq .object.sha)
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "sha=$DEV_HEAD" >> "$GITHUB_OUTPUT"
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: deploying current dev HEAD ($DEV_HEAD)."
            exit 0
          fi
          if [ "$DEV_HEAD" != "$EVENT_SHA" ]; then
            echo "::notice::dev advanced past $EVENT_SHA; skipping stale staging deployment."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "sha=$EVENT_SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved commit SHA from workflow_run: $EVENT_SHA"

  # Asks Render to deploy the exact commit and waits for it to go live. 30 minutes leaves room for slow Render deploys,
  # which have taken over 12 minutes.
  deploy_staging:
    name: Deploy to staging
    needs: [prepare]
    if: needs.prepare.outputs.eligible == 'true'
    uses: pesu-dev/actions/.github/workflows/deploy_render.yml@v1
    with:
      environment: staging
      commit_sha: ${{ needs.prepare.outputs.sha }}
      wait_for_completion: true
      timeout_seconds: 1800
    secrets: inherit
