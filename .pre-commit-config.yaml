repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [ --fix, --exit-non-zero-on-fix ]
        types_or: [ python, pyi, jupyter ]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: requirements-txt-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-yaml
      - id: check-toml
      - id: debug-statements
      - id: name-tests-test
        args: [ '--pytest-test-first' ]

  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm
          # Without it the YAML frontmatter of the Copilot custom agents in .github/agents/ is
          # rewritten as Markdown, and Copilot stops recognising them
          - mdformat-frontmatter

  - repo: local
    hooks:
      # .github/agents/ is generated from the roles in the pesu-dev/skills submodule. A submodule bump
      # changes no tracked Markdown file, so this runs on every commit rather than on matching files.
      - id: sync-agents
        name: Check Copilot custom agents match the roles
        entry: python scripts/sync_agents.py --check
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: Run Pytest
        entry: python scripts/run_tests.py
        language: system
        types: [ python ]
        pass_filenames: false
        # Print the run even when it passes. Without this pre-commit swallows the output, so the
        # test counts, the coverage total and the "live tests skipped" warning were all invisible
        # in CI -- a partial run looked identical to a full one.
        verbose: true
