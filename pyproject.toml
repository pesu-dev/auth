[project]
name = "pesu-auth"
version = "5.0.2"
description = "A simple API to authenticate PESU credentials using PESU Academy."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [
    { name = "Aditeya Baral", email = "aditeya.baral@gmail.com" }
]
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "httpx2>=2.12.0",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.3",
    "ruff>=0.16.7"
]

benchmark = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "seaborn>=0.13.2",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.coverage.run]
# Every Python file outside tests/, not just the app: the scripts are run by CI and by
# contributors, and a file no test imports would otherwise be missing from the report entirely
source = ["app", "scripts", ".github/scripts"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
# Only the entry point itself; everything it calls lives in a function that is tested
exclude_also = ['if __name__ == "__main__":']

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "secret_required: marks tests that require secrets or environment variables (e.g. TEST_PRN, TEST_PASSWORD)"
]

[tool.ruff.lint]
select = [
    "E", # Pycodestyle errors
    "F", # Pyflakes errors
    "W", # Pycodestyle warnings
    "UP", # Pyupgrade rules
    "I", # Import related rules
    "C90", # Complexity rules
    "D", # Documentation rules
    "ANN", # Annotations rules
    "TYP", # Type checking rules
    "N", # Naming rules
    "Q000", # Quotation style rules
    "RET", # Return type rules
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = [
    "tests/",
    # Agent instructions and skills from the pesu-dev/skills submodule, which lints them itself.
    # The Lint workflow checks out without submodules, so these are dangling links there and ruff would
    # fail to read them.
    "AGENTS.md",
    ".agents/",
]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true



